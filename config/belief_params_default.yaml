/**:
  ros__parameters:
    frame_id: map

    x_min: 0.0
    x_max: 2.0
    y_min: 0.0
    y_max: 4.0

    kernel_type: rbf
    training_iter: 25
    learning_rate: 0.1

    # inputs are normalized by the physical domain bounds before hitting the
    # kernel (x_norm = (x - x_min) / (x_max - x_min)), so these lengthscales
    # are fractions of the domain size, not meters. To match the field's true
    # spatial correlation length (0.18 m, see REFERENCE_SIGMA in
    # official_scripts/*/00_generate_fields.py) with xmax=2 and ymax=4:
    # 0.18 / 2.0 = 0.09 (x), 0.18 / 4.0 = 0.045 (y)
    init_lengthscale_x: 0.09
    init_lengthscale_y: 0.045
    init_outputscale: 1.0
    init_noise: 0.01

    refit_policy: every_k_measurements
    refit_every_k: 1
    # if false, init_lengthscale_x/y, init_outputscale, and init_noise stay
    # fixed (no Adam training loop); the posterior still updates on every
    # refit since the GP is rebuilt against all current measurements
    optimize_hyperparameters: false

    # GP input/kernel variant: baseline (x/y only) or wall_aware (x/y plus one
    # smooth feature per wall). baseline does not use the wall_* parameters and
    # needs no geometry file. See config/belief_params_wall_aware.yaml.
    model_variant: baseline
    wall_beta: 1.0              # feature sharpness across a wall [1/m]
    wall_rho: 0.35              # feature decay length away from a wall [m]
    init_wall_lengthscale: 1.0  # initial wall-feature lengthscale [-]
    # absolute path, or relative to the installed scalar_field_belief share
    # directory; walls must be given in frame_id. Only read in wall_aware mode.
    wall_geometry_file: ''


    # visualization 
    publish_visualization: true
    visualization_grid_step: 0.1
    visualization_z_mode: flat
    visualization_height_scale: 0.5
    # these parameters are the only runtime-dynamic parameters
    field_color_min: 0.0
    field_color_max: 0.015
    use_fixed_field_color_max: false
    z_offset: -0.8